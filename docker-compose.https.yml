services:
  app:
    environment:
      CHATGPT2API_FORCE_HTTPS: "true"

  caddy:
    image: caddy:2.10-alpine
    container_name: chatgpt2api-https
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${CHATGPT2API_HTTPS_PORT:-3443}:443"
    environment:
      CHATGPT2API_HTTPS_HOST: "${CHATGPT2API_HTTPS_HOST:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
